<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayTrack — Activación</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f11;
      color: #e4e4e7;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
    }
    .container {
      width: 380px;
      text-align: center;
      padding: 2.5rem 2rem;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      -webkit-app-region: no-drag;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      border-radius: 16px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      font-size: 0.82rem;
      color: #71717a;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }
    .input-group {
      position: relative;
      margin-bottom: 0.75rem;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #09090b;
      border: 1.5px solid #3f3f46;
      border-radius: 9px;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.15s;
      font-family: 'Courier New', monospace;
    }
    input:focus { border-color: #635bff; }
    input::placeholder { text-transform: none; letter-spacing: 0; color: #52525b; font-family: -apple-system, sans-serif; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #635bff;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 0.25rem;
    }
    button:hover:not(:disabled) { background: #4f46e5; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 0.9rem;
      font-size: 0.8rem;
      min-height: 1.2rem;
      border-radius: 7px;
      padding: 0.4rem 0.75rem;
    }
    .msg.error { color: #f87171; background: rgba(248,113,113,0.08); }
    .msg.success { color: #4ade80; background: rgba(74,222,128,0.08); }
    .msg.hidden { visibility: hidden; }
    .divider {
      width: 40px;
      height: 2px;
      background: #635bff;
      border-radius: 2px;
      margin: 0 auto 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="assets/icon.png" alt="PayTrack" onerror="this.style.display='none'">
    <h1>PayTrack</h1>
    <div class="divider"></div>
    <p class="subtitle">Ingresa el código de activación<br>para habilitar esta instalación</p>
    <div class="input-group">
      <input id="code" type="text" placeholder="XXXX-XXXX-XXXX" maxlength="14" autocomplete="off" spellcheck="false">
    </div>
    <button id="btn" onclick="activar()">Activar aplicación</button>
    <div id="msg" class="msg hidden">–</div>
  </div>

  <script>
    const input = document.getElementById('code');
    const btn   = document.getElementById('btn');
    const msg   = document.getElementById('msg');

    // Auto-format XXXX-XXXX-XXXX while typing
    input.addEventListener('input', () => {
      let v = input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 12);
      if (v.length > 8)      v = v.slice(0,4) + '-' + v.slice(4,8) + '-' + v.slice(8);
      else if (v.length > 4) v = v.slice(0,4) + '-' + v.slice(4);
      input.value = v;
    });

    input.addEventListener('keyup', e => { if (e.key === 'Enter') activar(); });

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    async function activar() {
      const code = input.value.trim();
      if (code.length < 14) { showMsg('El código debe tener el formato XXXX-XXXX-XXXX', 'error'); return; }
      btn.disabled = true;
      btn.textContent = 'Verificando…';
      showMsg('', 'hidden');

      try {
        const result = await window.activationAPI.validate(code);
        if (result.ok) {
          showMsg(`Activado para ${result.nombre_agente} — iniciando…`, 'success');
          btn.textContent = 'Abriendo PayTrack…';
        } else {
          showMsg(result.error || 'Código inválido', 'error');
          btn.disabled = false;
          btn.textContent = 'Activar aplicación';
        }
      } catch (err) {
        showMsg('Error de conexión. Verifica tu internet.', 'error');
        btn.disabled = false;
        btn.textContent = 'Activar aplicación';
      }
    }
  </script>
</body>
</html>
