<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;">
  <title>CashRD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1915;
      width: 480px;
      height: 300px;
      overflow: hidden;
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(184,150,46,0.08);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .logo-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: riseIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo-img {
      width: 260px;
      margin-bottom: 14px;
    }
    .tagline {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .progress-track {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: rgba(255,255,255,0.04);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #b8962e, #d4af5a);
      width: 0%;
      animation: loadBar 2.6s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes loadBar {
      0%   { width: 0%; }
      40%  { width: 55%; }
      70%  { width: 78%; }
      90%  { width: 90%; }
      100% { width: 100%; }
    }
    .version {
      position: absolute;
      bottom: 10px; right: 14px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="ring" style="width:320px;height:320px;"></div>
  <div class="ring" style="width:220px;height:220px;"></div>

  <div class="logo-wrap">
    <img class="logo-img" src="../public/CashRD_logo.png" alt="CashRD" style="filter:brightness(10);" onerror="this.style.display='none'">
    <div class="tagline">Gestión de Cartera · app.cashrd.com</div>
  </div>

  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>

  <div class="version">v1.7.0</div>
</body>
</html>
